[functions.gmail-connect]
# POST verifies the user JWT and coordinator role in the handler.
# GET is a Google callback authenticated with expiring single-use OAuth state.
verify_jwt = false

[functions.mail-assistant]
# Handler authenticates user JWT + coordinator role, or single-use scoped cron token.
verify_jwt = false

[functions.news-feed]
# Handler verifies the user JWT and coordinator role before fetching fixed public feeds.
verify_jwt = false
